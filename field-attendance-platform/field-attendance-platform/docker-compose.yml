# Local dev services only (Postgres + Redis). Run backend/frontend on the host.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: field_attendance, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
